<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #141518;
        --card: #1e2025;
        --line: #2f3239;
        --ink: #ece9e2;
        --muted: #98a0a9;
        --gold: #d7b061;
        --red: #c4443a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px 14px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      h1 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .rec { color: var(--red); font-weight: 700; }
      .time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
      .status {
        margin: 10px 0 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--muted);
        min-height: 34px;
      }
      .status.recording { color: var(--ink); }
      .status.ready { color: var(--gold); }
      .row { display: grid; gap: 8px; margin-top: 10px; }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--red);
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button:disabled { opacity: .45; cursor: default; }
      button.save { background: var(--gold); color: #17181b; }
      a.save { display: block; text-align: center; }
      .fine { margin: 8px 0 0; color: #5f666e; font-size: 9px; }
      kbd {
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--card);
        font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="rec">●</span> recorder</h1>
      <span class="time" id="time">00:00</span>
    </header>

    <p class="status" id="status">idle</p>

    <div class="row">
      <button id="stop" disabled>Stop recording</button>
      <a class="save" id="save" hidden><button class="save" id="savebtn" type="button">Save to Downloads</button></a>
    </div>
    <p class="fine">
      Holds the video itself, so stopping it does not depend on any other window. Stop with
      <kbd>Ctrl+Shift+S</kbd> from the board, or from here.
    </p>

    <script src="record.js" type="module"></script>
  </body>
</html>
