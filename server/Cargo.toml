[package]
name = "chesscan-server"
version = "0.1.0"
edition = "2021"
description = "Remote analysis service for the chesscan extension: a from-scratch chess engine plus a human-like move selector."
license = "MIT"

[[bin]]
name = "chesscan-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
