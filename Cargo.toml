[package]
name = "chesscan"
version = "0.4.0"
edition = "2021"
description = "Live screen chess scanner: board OCR -> FEN -> engine -> overlay"
license = "MIT"

[lib]
name = "chesscan"
path = "src/lib.rs"

[[bin]]
name = "chesscan"
path = "src/main.rs"

[[bin]]
name = "chesscan-gui"
path = "src/bin/chesscan-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Overlay (HUD window used by the CLI)
winit = "0.30"
softbuffer = "0.4"

# Live screen capture. Disable with --no-default-features for headless/CI.
xcap = { version = "0.2", optional = true }

# Desktop app.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[features]
default = ["live", "gui"]
live = ["dep:xcap"]
gui = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"